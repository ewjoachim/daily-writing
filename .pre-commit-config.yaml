ci:
  autoupdate_schedule: quarterly
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: builtin
    hooks:
      # File names
      - id: check-case-conflict # File formats
      - id: pretty-format-json
      - id: check-json
      - id: check-toml
      - id: check-yaml # Executables
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable # Git shenanigans
      - id: check-merge-conflict
      - id: check-added-large-files # Python issues
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: no-commit-to-branch

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --group lint ruff check --force-exclude --fix --unsafe-fixes --show-fixes
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --group lint ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: uv-lock
        name: uv-lock
        entry: uv lock
        language: system
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: uv run --group lint basedpyright
        language: system
        types_or: [python, pyi]
        require_serial: true

      # zizmor is not a project dependency, so run it as a one-off tool.
      - id: zizmor
        name: zizmor
        entry: uvx zizmor@1.28.0 --no-progress --fix=all
        language: system
        types: [yaml]
        files: (\.github/(workflows/.*|dependabot\.ya?ml))|(action\.ya?ml)$
        require_serial: true
