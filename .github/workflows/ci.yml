name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

env:
  UV_FROZEN: "true"
  UV_LINK_MODE: copy

permissions:
  contents: read

jobs:
  lint:
    name: linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up UV
        id: setup-uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          PREK_SKIP: no-commit-to-branch

  tests:
    strategy:
      matrix:
        include:
          - python_version: "3.14"
            os: ubuntu-latest
          - python_version: "3.14"
            os: windows-latest

    name: "py${{ matrix.python_version }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up UV
        id: setup-uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python_version }}
          enable-cache: false

      - name: Run tests
        run: uv run --all-groups --all-extras pytest
        env:
          COVERAGE_FILE: ".coverage.${{ matrix.python_version }}"

      - name: Store coverage file
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python_version }}
          path: .coverage.${{ matrix.python_version }}
          include-hidden-files: true

  coverage:
    name: Coverage
    # The action's activity heuristic only handles pull_request and branch pushes
    if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    needs: [tests]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action passes its own token to git, so nothing needs persisting
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Set up UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Prepare merged coverage data
        run: uvx coverage combine

      - name: Display coverage
        uses: ewjoachim/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

      # - name: Enforce coverage >= 100%
      #   run: uvx coverage report --fail-under=100

  tag:
    name: Determine release tag
    # Skipped on any other event, which skips `publish` along with it
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - tests
      - lint
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute tag
        id: tag
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import datetime
          import json
          import os
          import re
          import subprocess

          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              now = datetime.datetime.now(datetime.UTC)
              prefix = f"{now.year}.{now.month}"
              repo = os.environ["GITHUB_REPOSITORY"]
              # matching-refs does a prefix match, so this returns only this month's tags
              refs = json.loads(
                  subprocess.run(
                      ["gh", "api", f"repos/{repo}/git/matching-refs/tags/{prefix}."],
                      capture_output=True,
                      text=True,
                      check=True,
                  ).stdout
              )
              tags = [ref["ref"].removeprefix("refs/tags/") for ref in refs]
              patches = [
                  int(match[1])
                  for tag in tags
                  if (match := re.fullmatch(rf"{re.escape(prefix)}\.(\d+)", tag))
              ]
              tag = f"{prefix}.{max(patches, default=0) + 1}"
          else:
              tag = os.environ["GITHUB_REF_NAME"]

          print(f"Tag: {tag}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tag={tag}\n")

      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "${TAG}" --target "${GITHUB_SHA}" --generate-notes

  publish:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    # tag itself needs tests + lint, so those gate this transitively
    needs:
      - tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # uv-dynamic-versioning derives the version from the checked-out tag
          ref: ${{ needs.tag.outputs.tag }}

      - name: Set up UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build wheel & sdist
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
